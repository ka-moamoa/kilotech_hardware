[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kilotech-common"
version = "0.1.0"
description = "Wire protocol models and config helpers shared by the Kilotech cluster nodes"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["kilotech_common*"]
